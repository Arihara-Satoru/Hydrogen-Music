<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hydrogen Music</title>
    <style>
      :root {
        --splash-scale: 2;
        color-scheme: dark;
        font-family:
          Inter, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
        background: #101419;
        color: #f2f6f8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: #101419;
        user-select: none;
      }

      main {
        position: absolute;
        top: 0;
        left: 0;
        width: 360px;
        height: 240px;
        transform: scale(var(--splash-scale));
        transform-origin: top left;
      }

      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .logo {
        position: absolute;
        top: 29px;
        left: 18px;
        width: 24px;
        height: 24px;
        border: 1px solid rgba(207, 223, 232, 0.32);
        border-radius: 6px;
      }

      .brand {
        position: absolute;
        top: 101px;
        right: 17px;
        width: 107px;
      }

      .brand h1 {
        margin: 0;
        color: #f4f7f8;
        font-family: "Arial Narrow", Inter, "Segoe UI", sans-serif;
        font-size: 13.5px;
        font-stretch: condensed;
        font-weight: 800;
        letter-spacing: -0.45px;
        line-height: 1;
        white-space: nowrap;
      }

      .brand p {
        margin: 9px 0 0;
        color: #8796a1;
        font-family: Consolas, "SFMono-Regular", monospace;
        font-size: 6.5px;
        letter-spacing: 0.8px;
        line-height: 1;
        white-space: nowrap;
      }

      .loading {
        position: absolute;
        right: 20px;
        bottom: 16px;
        left: 20px;
      }

      .status {
        min-height: 12px;
        margin: 0 0 7px;
        color: #eef4f7;
        font-size: 8.5px;
        font-weight: 500;
        letter-spacing: 0.2px;
        line-height: 12px;
      }

      .progress {
        width: 100%;
        height: 6px;
        overflow: hidden;
        border: 1px solid #8494a0;
        background: #111920;
      }

      .progress-fill {
        position: relative;
        width: 12%;
        height: 100%;
        background: #eff5f7;
        transition: width 620ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .progress-fill::after {
        position: absolute;
        top: -1px;
        right: -1px;
        bottom: -1px;
        width: 2px;
        background: #e1c92e;
        content: "";
      }

      @media (prefers-reduced-motion: reduce) {
        .progress-fill {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="Hydrogen Music 正在启动">
      <canvas id="scene" class="scene" aria-hidden="true"></canvas>
      <img class="logo" src="./src/assets/icon/icon.png" alt="" />
      <section class="brand" aria-label="Hydrogen Music">
        <h1>HYDROGEN MUSIC</h1>
        <p>SIGNAL CALIBRATION</p>
      </section>
      <section class="loading" aria-live="polite">
        <p id="status" class="status">正在初始化...</p>
        <div
          id="progress"
          class="progress"
          role="progressbar"
          aria-label="启动进度"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="12"
        >
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </section>
    </main>
    <script>
      const canvas = document.getElementById("scene");
      const context = canvas.getContext("2d");
      const statusElement = document.getElementById("status");
      const progressElement = document.getElementById("progress");
      const progressFill = document.getElementById("progress-fill");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const viewport = { width: 360, height: 240, dpr: 1 };
      const TAU = Math.PI * 2;

      // ponytail: 低精度大陆轮廓让启动页保持零依赖；若要地图级精度，再替换为压缩海岸线数据。
      const landPolygons = [
        [
          [-168, 70], [-145, 72], [-122, 58], [-123, 48], [-114, 32],
          [-103, 25], [-97, 17], [-86, 16], [-79, 25], [-82, 31],
          [-73, 42], [-60, 52], [-64, 62], [-92, 72],
        ],
        [
          [-82, 12], [-70, 10], [-55, 5], [-44, -2], [-36, -10],
          [-45, -24], [-52, -34], [-57, -52], [-67, -45], [-72, -24],
          [-78, -8],
        ],
        [
          [-11, 36], [3, 44], [20, 46], [31, 39], [26, 32], [10, 35],
        ],
        [
          [-17, 35], [3, 37], [22, 32], [36, 20], [51, 11], [43, -13],
          [31, -34], [17, -35], [7, -23], [-3, -5], [-15, 14],
        ],
        [
          [26, 34], [42, 54], [62, 70], [98, 75], [135, 58], [162, 47],
          [145, 24], [118, 6], [89, 9], [71, 22], [52, 28],
        ],
        [
          [112, -11], [136, -10], [154, -20], [151, -39], [130, -44],
          [114, -29],
        ],
        [
          [-53, 59], [-31, 63], [-20, 76], [-43, 83], [-64, 76],
        ],
      ];

      const pointInPolygon = (longitude, latitude, polygon) => {
        let inside = false;
        for (let index = 0, previous = polygon.length - 1; index < polygon.length; previous = index++) {
          const [x, y] = polygon[index];
          const [previousX, previousY] = polygon[previous];
          if (
            y > latitude !== previousY > latitude &&
            longitude < ((previousX - x) * (latitude - y)) / (previousY - y) + x
          ) {
            inside = !inside;
          }
        }
        return inside;
      };

      const isLand = (longitude, latitude) =>
        landPolygons.some((polygon) => pointInPolygon(longitude, latitude, polygon));

      let randomState = 0x48594d;
      const random = () => {
        randomState = (Math.imul(randomState, 1664525) + 1013904223) >>> 0;
        return randomState / 4294967296;
      };

      const makeSpherePoints = (latitudeStep, longitudeStep, landOnly) => {
        const points = [];
        for (let latitude = -72; latitude <= 78; latitude += latitudeStep) {
          for (let longitude = -180; longitude < 180; longitude += longitudeStep) {
            const jitteredLongitude = longitude + (random() - 0.5) * 1.6;
            const jitteredLatitude = latitude + (random() - 0.5) * 1.2;
            if (!landOnly || isLand(jitteredLongitude, jitteredLatitude)) {
              points.push({
                latitude: (jitteredLatitude * Math.PI) / 180,
                longitude: (jitteredLongitude * Math.PI) / 180,
              });
            }
          }
        }
        return points;
      };

      const surfacePoints = makeSpherePoints(6, 8, false);
      const landPoints = makeSpherePoints(2.8, 3.6, true);
      const ambientPoints = Array.from({ length: 72 }, () => ({
        x: 45 + random() * 250,
        y: 36 + random() * 126,
        size: 0.25 + random() * 0.55,
        opacity: 0.08 + random() * 0.24,
      }));

      const resizeCanvas = () => {
        const bounds = canvas.getBoundingClientRect();
        viewport.width = canvas.offsetWidth || 360;
        viewport.height = canvas.offsetHeight || 240;
        const displayScale = bounds.width / viewport.width || 1;
        viewport.dpr = Math.min(window.devicePixelRatio || 1, 2) * displayScale;
        canvas.width = Math.round(viewport.width * viewport.dpr);
        canvas.height = Math.round(viewport.height * viewport.dpr);
        context.setTransform(viewport.dpr, 0, 0, viewport.dpr, 0, 0);
      };

      const drawHelix = ({ x, y, length, amplitude, angle, phase, opacity }) => {
        const segments = 42;
        context.save();
        context.translate(x, y);
        context.rotate(angle);

        for (let index = 0; index <= segments; index += 1) {
          const ratio = index / segments;
          const axis = (ratio - 0.5) * length;
          const wavePhase = ratio * Math.PI * 7 + phase;
          const offset = Math.sin(wavePhase) * amplitude;
          const depth = (Math.cos(wavePhase) + 1) / 2;

          context.fillStyle = `rgba(134, 165, 184, ${opacity * (0.35 + depth * 0.65)})`;
          context.beginPath();
          context.arc(axis, offset, 0.45 + depth * 0.45, 0, TAU);
          context.fill();

          context.fillStyle = `rgba(134, 165, 184, ${opacity * (1 - depth * 0.65)})`;
          context.beginPath();
          context.arc(axis, -offset, 0.45 + (1 - depth) * 0.45, 0, TAU);
          context.fill();

          if (index % 4 === 0) {
            context.strokeStyle = `rgba(134, 165, 184, ${opacity * 0.42})`;
            context.lineWidth = 0.45;
            context.beginPath();
            context.moveTo(axis, offset);
            context.lineTo(axis, -offset);
            context.stroke();
          }
        }
        context.restore();
      };

      const drawWaveform = (time) => {
        const y = 107;
        context.strokeStyle = "rgba(136, 161, 175, 0.32)";
        context.lineWidth = 0.55;
        context.beginPath();
        context.moveTo(35, y);
        context.lineTo(223, y);
        context.stroke();

        context.strokeStyle = "rgba(205, 222, 231, 0.72)";
        for (let x = 140; x <= 220; x += 3) {
          const envelope = Math.max(0, 1 - Math.abs(x - 181) / 45);
          const wave = Math.sin(x * 0.31 + time * 0.0018) * 0.5 + 0.5;
          const height = 1 + envelope * wave * 9;
          context.beginPath();
          context.moveTo(x, y - height);
          context.lineTo(x, y + height);
          context.stroke();
        }
      };

      const drawSphereLayer = (points, rotation, opacity, minSize, maxSize) => {
        const centerX = 105;
        const centerY = 107;
        const radius = 45;
        for (const point of points) {
          const rotatedLongitude = point.longitude + rotation;
          const latitudeCosine = Math.cos(point.latitude);
          const depth = latitudeCosine * Math.cos(rotatedLongitude);
          if (depth <= 0.03) continue;

          const x = centerX + radius * latitudeCosine * Math.sin(rotatedLongitude);
          const y = centerY - radius * Math.sin(point.latitude);
          const size = minSize + (maxSize - minSize) * depth;
          context.fillStyle = `rgba(202, 222, 234, ${opacity * (0.2 + depth * 0.8)})`;
          context.beginPath();
          context.arc(x, y, size, 0, TAU);
          context.fill();
        }
      };

      const drawCalibration = () => {
        const centerX = 105;
        const centerY = 107;
        context.lineWidth = 0.65;
        context.strokeStyle = "rgba(230, 239, 243, 0.82)";
        for (const [radius, start, end] of [
          [62, -2.9, -0.74],
          [62, 0.74, 2.9],
          [55, -2.66, -0.86],
          [55, 0.86, 2.66],
        ]) {
          context.beginPath();
          context.arc(centerX, centerY, radius, start, end);
          context.stroke();
        }

        context.lineWidth = 1;
        for (const [x1, y1, x2, y2] of [
          [105, 37, 105, 47],
          [105, 167, 105, 177],
          [35, 107, 45, 107],
          [165, 107, 175, 107],
        ]) {
          context.beginPath();
          context.moveTo(x1, y1);
          context.lineTo(x2, y2);
          context.stroke();
        }

        context.strokeStyle = "#e1c92e";
        context.beginPath();
        context.moveTo(105, 52);
        context.lineTo(105, 58);
        context.stroke();
      };

      const drawGlobe = (time) => {
        const rotation = 1.55 + time * 0.00008;
        drawSphereLayer(surfacePoints, rotation, 0.16, 0.25, 0.5);
        drawSphereLayer(landPoints, rotation, 0.9, 0.35, 0.85);

        context.strokeStyle = "rgba(160, 187, 201, 0.35)";
        context.lineWidth = 0.55;
        context.beginPath();
        context.arc(105, 107, 46, 0, TAU);
        context.stroke();
      };

      const drawScene = (time) => {
        context.clearRect(0, 0, viewport.width, viewport.height);

        for (const point of ambientPoints) {
          context.fillStyle = `rgba(160, 188, 203, ${point.opacity})`;
          context.fillRect(point.x, point.y, point.size, point.size);
        }

        drawHelix({
          x: 38,
          y: 91,
          length: 176,
          amplitude: 8,
          angle: Math.PI * 0.47,
          phase: time * 0.00022,
          opacity: 0.28,
        });
        drawHelix({
          x: 290,
          y: 145,
          length: 118,
          amplitude: 7,
          angle: -0.68,
          phase: -time * 0.00018 + 1.6,
          opacity: 0.18,
        });
        drawWaveform(time);
        drawGlobe(time);
        drawCalibration();
      };

      let animationFrame = null;
      let lastFrame = 0;
      const animate = (time) => {
        if (time - lastFrame >= 1000 / 30) {
          drawScene(time);
          lastFrame = time;
        }
        animationFrame = requestAnimationFrame(animate);
      };

      const startAnimation = () => {
        if (animationFrame !== null) cancelAnimationFrame(animationFrame);
        animationFrame = null;
        if (reduceMotion.matches) {
          drawScene(0);
          return;
        }
        animationFrame = requestAnimationFrame(animate);
      };

      window.setSplashStatus = (status, progress) => {
        if (typeof status === "string" && status.trim()) {
          statusElement.textContent = status;
        }
        const nextProgress = Number(progress);
        if (Number.isFinite(nextProgress)) {
          const clampedProgress = Math.min(100, Math.max(0, nextProgress));
          progressFill.style.width = `${clampedProgress}%`;
          progressElement.setAttribute("aria-valuenow", String(Math.round(clampedProgress)));
        }
      };

      resizeCanvas();
      startAnimation();
      window.addEventListener("resize", () => {
        resizeCanvas();
        if (reduceMotion.matches) drawScene(0);
      });
      if (typeof reduceMotion.addEventListener === "function") {
        reduceMotion.addEventListener("change", startAnimation);
      }
      window.addEventListener("beforeunload", () => {
        if (animationFrame !== null) cancelAnimationFrame(animationFrame);
      });
    </script>
  </body>
</html>
