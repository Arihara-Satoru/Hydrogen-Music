<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splash QA Preview</title>
    <style>
      html,
      body,
      iframe {
        width: 720px;
        height: 480px;
        margin: 0;
        border: 0;
        overflow: hidden;
        display: block;
        background: #101419;
      }
    </style>
  </head>
  <body>
    <iframe id="splash" src="/splash.html" title="Hydrogen Music 启动画面"></iframe>
    <script>
      const splashFrame = document.getElementById("splash");
      splashFrame.addEventListener("load", () => {
        splashFrame.contentWindow.setSplashStatus("正在启动音乐服务...", 38);
      });
    </script>
  </body>
</html>
