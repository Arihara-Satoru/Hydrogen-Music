<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>白域断层</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Cascadia Mono", "IBM Plex Mono", Consolas, "Microsoft YaHei UI", monospace;
        --paper: #e9eae4;
        --ink: #242824;
        --muted: #777c73;
        --faint: rgba(36, 40, 36, 0.14);
        --signal: #ad5838;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--paper);
        user-select: none;
      }

      body {
        opacity: 0;
        transition: opacity 180ms ease-out, background 520ms ease-in;
      }

      body.ready { opacity: 1; }
      body.finishing { background: #f5f5f0; }

      main,
      #scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #scene { display: block; }

      .frame {
        position: absolute;
        inset: 27px 30px 29px;
        border-left: 1px solid rgba(36, 40, 36, 0.22);
        border-right: 1px solid rgba(36, 40, 36, 0.08);
        pointer-events: none;
        transition: opacity 260ms ease, transform 520ms cubic-bezier(0.7, 0, 0.3, 1);
      }

      .frame::before,
      .frame::after {
        content: "";
        position: absolute;
        left: -4px;
        width: 8px;
        height: 1px;
        background: var(--ink);
      }

      .frame::before { top: 0; }
      .frame::after { bottom: 0; }

      .telemetry {
        position: absolute;
        top: 42px;
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--muted);
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.16em;
        line-height: 1;
        text-transform: uppercase;
        opacity: 0;
        transform: translateY(-7px);
        animation: settle-in 560ms 180ms ease-out forwards;
      }

      .telemetry.left { left: 48px; }
      .telemetry.right { right: 47px; }

      .telemetry .index {
        color: var(--ink);
        font-size: 14px;
        letter-spacing: -0.04em;
      }

      .telemetry .pip {
        width: 5px;
        height: 5px;
        border: 1px solid var(--signal);
        background: rgba(173, 88, 56, 0.12);
      }

      .datum-label {
        position: absolute;
        left: 48px;
        top: 180px;
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 8px;
        letter-spacing: 0.19em;
        line-height: 1;
        opacity: 0;
        animation: settle-in 520ms 440ms ease-out forwards;
      }

      .datum-label strong {
        color: var(--ink);
        font-size: 10px;
        font-weight: 650;
        letter-spacing: 0.1em;
      }

      .status-block {
        position: absolute;
        right: 48px;
        bottom: 47px;
        left: 48px;
        transition: opacity 220ms ease, transform 430ms cubic-bezier(0.7, 0, 0.3, 1);
      }

      .status-line {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        min-height: 23px;
        margin-bottom: 9px;
      }

      #status-text {
        color: var(--ink);
        font-size: 10px;
        font-weight: 650;
        letter-spacing: 0.1em;
      }

      #status-text::before {
        content: "";
        display: inline-block;
        width: 12px;
        height: 1px;
        margin: 0 9px 3px 0;
        background: var(--signal);
      }

      #progress-text {
        color: var(--ink);
        font-size: 24px;
        font-weight: 300;
        letter-spacing: -0.08em;
        line-height: 0.8;
        font-variant-numeric: tabular-nums;
      }

      #progress-text small {
        margin-left: 3px;
        color: var(--muted);
        font-size: 8px;
        letter-spacing: 0;
      }

      .progress-rail {
        position: relative;
        display: grid;
        grid-template-columns: repeat(24, 1fr);
        gap: 4px;
        height: 6px;
      }

      .progress-rail span {
        height: 1px;
        margin-top: 3px;
        background: rgba(36, 40, 36, 0.17);
        transition: height 180ms ease, margin 180ms ease, background 180ms ease;
      }

      .progress-rail span.active {
        height: 4px;
        margin-top: 0;
        background: var(--ink);
      }

      .progress-rail span.head { background: var(--signal); }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      body.finishing .frame {
        opacity: 0;
        transform: scaleX(1.08);
      }

      body.finishing .telemetry,
      body.finishing .datum-label,
      body.finishing .status-block {
        opacity: 0 !important;
        transform: translateY(8px);
      }

      @keyframes settle-in {
        to { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        body,
        .frame,
        .telemetry,
        .datum-label,
        .status-block,
        .progress-rail span {
          animation: none;
          transition-duration: 80ms;
        }

        body,
        .telemetry,
        .datum-label { opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body>
    <main aria-label="白域断层启动动画">
      <canvas id="scene" aria-hidden="true"></canvas>
      <div class="frame" aria-hidden="true"></div>

      <div class="telemetry left" aria-hidden="true">
        <span class="index">07</span>
        <span>cold field / local</span>
      </div>
      <div class="telemetry right" aria-hidden="true">
        <span class="pip"></span>
        <span>air 0.41 · stable</span>
      </div>

      <div class="datum-label" aria-hidden="true">
        <span>isolation datum</span>
        <strong>Δ 04 / 17</strong>
      </div>

      <section class="status-block" aria-label="启动进度">
        <div class="status-line">
          <span id="status-text" aria-live="polite">正在校准冷启动场</span>
          <span id="progress-text">08<small>%</small></span>
        </div>
        <div
          id="progress-rail"
          class="progress-rail"
          role="progressbar"
          aria-label="启动进度"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="8"
        ></div>
      </section>
      <p id="progress-announcement" class="sr-only" aria-live="polite">正在启动，8%</p>
    </main>

    <script>
      (() => {
        "use strict";

        const DESIGN_WIDTH = 720;
        const DESIGN_HEIGHT = 480;
        const TAU = Math.PI * 2;
        const canvas = document.getElementById("scene");
        const context = canvas.getContext("2d", { alpha: false });
        const statusText = document.getElementById("status-text");
        const progressText = document.getElementById("progress-text");
        const progressRail = document.getElementById("progress-rail");
        const progressAnnouncement = document.getElementById("progress-announcement");
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
        const segments = Array.from({ length: 24 }, () => {
          const segment = document.createElement("span");
          progressRail.appendChild(segment);
          return segment;
        });

        let seed = 0x4f17d;
        const random = () => {
          seed = (seed * 1664525 + 1013904223) >>> 0;
          return seed / 4294967296;
        };
        const clamp = (value, min = 0, max = 1) => Math.min(max, Math.max(min, value));
        const lerp = (from, to, amount) => from + (to - from) * amount;
        const easeOut = (value) => 1 - Math.pow(1 - value, 3);
        const easeInOut = (value) =>
          value < 0.5 ? 4 * value * value * value : 1 - Math.pow(-2 * value + 2, 3) / 2;

        const fallout = Array.from({ length: 76 }, () => ({
          x: random() * DESIGN_WIDTH,
          y: random() * DESIGN_HEIGHT,
          size: 0.35 + random() * 1.25,
          speed: 3 + random() * 10,
          drift: 5 + random() * 15,
          phase: random() * TAU,
          alpha: 0.05 + random() * 0.15,
        }));

        const fracture = Array.from({ length: 15 }, (_, index) => ({
          x: 42 + index * 46 + (random() - 0.5) * 13,
          offset: (random() - 0.5) * 15,
          depth: 5 + random() * 18,
        }));

        const state = {
          startedAt: performance.now(),
          targetProgress: 0.08,
          visibleProgress: 0.08,
          lastRenderedAt: performance.now(),
          finishing: false,
          finishStartedAt: 0,
          animationFrame: 0,
        };

        const viewport = { width: DESIGN_WIDTH, height: DESIGN_HEIGHT, dpr: 1 };
        let grainLayer = null;

        const createGrainLayer = () => {
          const layer = document.createElement("canvas");
          layer.width = DESIGN_WIDTH;
          layer.height = DESIGN_HEIGHT;
          const grain = layer.getContext("2d");
          grain.clearRect(0, 0, layer.width, layer.height);
          for (let index = 0; index < 1450; index += 1) {
            const value = random() > 0.19 ? 42 : 173;
            grain.fillStyle = `rgba(${value}, ${value + 2}, ${value - 1}, ${0.018 + random() * 0.045})`;
            const size = random() > 0.92 ? 2 : 1;
            grain.fillRect(random() * layer.width, random() * layer.height, size, size);
          }
          return layer;
        };

        const resize = () => {
          const rect = canvas.getBoundingClientRect();
          viewport.width = rect.width || DESIGN_WIDTH;
          viewport.height = rect.height || DESIGN_HEIGHT;
          viewport.dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.round(viewport.width * viewport.dpr);
          canvas.height = Math.round(viewport.height * viewport.dpr);
          context.setTransform(
            viewport.dpr * viewport.width / DESIGN_WIDTH,
            0,
            0,
            viewport.dpr * viewport.height / DESIGN_HEIGHT,
            0,
            0,
          );
          grainLayer ||= createGrainLayer();
        };

        const line = (x1, y1, x2, y2, color, width = 1) => {
          context.strokeStyle = color;
          context.lineWidth = width;
          context.beginPath();
          context.moveTo(x1, y1);
          context.lineTo(x2, y2);
          context.stroke();
        };

        const drawBackground = (time, exit) => {
          const gradient = context.createLinearGradient(0, 0, DESIGN_WIDTH, DESIGN_HEIGHT);
          gradient.addColorStop(0, `rgb(${Math.round(238 + exit * 8)}, ${Math.round(239 + exit * 8)}, ${Math.round(233 + exit * 9)})`);
          gradient.addColorStop(0.55, `rgb(${Math.round(232 + exit * 12)}, ${Math.round(234 + exit * 11)}, ${Math.round(228 + exit * 12)})`);
          gradient.addColorStop(1, `rgb(${Math.round(224 + exit * 18)}, ${Math.round(227 + exit * 16)}, ${Math.round(220 + exit * 18)})`);
          context.fillStyle = gradient;
          context.fillRect(0, 0, DESIGN_WIDTH, DESIGN_HEIGHT);

          const clearing = context.createRadialGradient(380, 216, 12, 380, 216, 340);
          clearing.addColorStop(0, "rgba(255, 255, 250, 0.56)");
          clearing.addColorStop(0.55, "rgba(248, 248, 243, 0.16)");
          clearing.addColorStop(1, "rgba(255, 255, 255, 0)");
          context.fillStyle = clearing;
          context.fillRect(0, 0, DESIGN_WIDTH, DESIGN_HEIGHT);

          context.save();
          context.globalAlpha = 1 - exit;
          context.drawImage(grainLayer, 0, 0);
          context.restore();

          const driftTime = reducedMotion.matches ? 0 : time / 1000;
          fallout.forEach((particle) => {
            const x = (particle.x + driftTime * particle.drift) % (DESIGN_WIDTH + 20) - 10;
            const y = (particle.y + driftTime * particle.speed + Math.sin(driftTime + particle.phase) * 3) % (DESIGN_HEIGHT + 20) - 10;
            context.fillStyle = `rgba(43, 47, 42, ${particle.alpha * (1 - exit)})`;
            context.fillRect(x, y, particle.size * 1.8, particle.size);
          });
        };

        const drawSurveyField = (reveal, time, exit) => {
          const alpha = reveal * (1 - exit);
          context.save();
          context.globalAlpha = alpha;

          for (let x = 76; x <= 674; x += 46) {
            line(x, 76, x, 372, "rgba(36, 40, 36, 0.045)");
          }
          for (let y = 98; y <= 354; y += 32) {
            line(31, y, 689, y, "rgba(36, 40, 36, 0.038)");
          }

          const scanX = reducedMotion.matches ? 372 : 31 + ((time / 11) % 658);
          const scanGradient = context.createLinearGradient(scanX - 48, 0, scanX + 8, 0);
          scanGradient.addColorStop(0, "rgba(173, 88, 56, 0)");
          scanGradient.addColorStop(1, "rgba(173, 88, 56, 0.14)");
          context.fillStyle = scanGradient;
          context.fillRect(scanX - 48, 78, 56, 276);
          line(scanX, 78, scanX, 354, "rgba(173, 88, 56, 0.2)");

          [98, 130, 322, 354].forEach((y, row) => {
            for (let x = 31; x < 690; x += 23) {
              const tall = (x / 23 + row) % 4 === 0;
              line(x, y, x, y + (tall ? 6 : 3), "rgba(36, 40, 36, 0.2)");
            }
          });

          context.restore();
        };

        const drawRift = (reveal, time, exit) => {
          const collapse = 1 - exit;
          const left = lerp(360, 42, reveal) + exit * 318;
          const right = lerp(360, 678, reveal) - exit * 318;
          const centerY = 239;

          context.save();
          context.globalAlpha = collapse;
          context.fillStyle = "rgba(36, 40, 36, 0.035)";
          context.fillRect(left, 202, Math.max(0, right - left), 74);
          line(left, 202, right, 202, "rgba(36, 40, 36, 0.3)");
          line(left, 276, right, 276, "rgba(36, 40, 36, 0.16)");
          line(left, centerY, right, centerY, "rgba(36, 40, 36, 0.4)");

          context.beginPath();
          fracture.forEach((point, index) => {
            const y = centerY + point.offset * Math.sin(time / 1800 + index * 0.77) * (reducedMotion.matches ? 0.25 : 1);
            if (index === 0) context.moveTo(Math.max(left, point.x), y);
            else context.lineTo(Math.min(right, point.x), y);
          });
          context.strokeStyle = "rgba(36, 40, 36, 0.62)";
          context.lineWidth = 1;
          context.stroke();

          fracture.forEach((point, index) => {
            if (point.x < left || point.x > right || index % 2 !== 0) return;
            const direction = index % 4 === 0 ? -1 : 1;
            line(
              point.x,
              centerY + point.offset * 0.4,
              point.x + direction * point.depth * 0.45,
              centerY + direction * point.depth,
              "rgba(36, 40, 36, 0.26)",
            );
          });

          for (let index = 0; index < 12; index += 1) {
            const x = 66 + index * 53;
            const offset = Math.sin(index * 2.1) * 4;
            line(x, 214 + offset, x + 18, 214 + offset, "rgba(36, 40, 36, 0.25)");
            line(x + 7, 263 - offset, x + 27, 263 - offset, "rgba(36, 40, 36, 0.13)");
          }

          const carrier = reducedMotion.matches ? 0.62 : (time / 3600) % 1;
          const carrierX = lerp(62, 658, carrier);
          line(carrierX, 198, carrierX, 280, "rgba(173, 88, 56, 0.32)");
          context.fillStyle = "#2b2e2a";
          context.fillRect(carrierX - 8, centerY - 8, 16, 16);
          context.fillStyle = "#ad5838";
          context.fillRect(carrierX - 2, centerY - 2, 4, 4);

          context.font = '8px "Cascadia Mono", Consolas, monospace';
          context.fillStyle = "rgba(36, 40, 36, 0.58)";
          context.letterSpacing = "1px";
          context.fillText("FIELD DISCONTINUITY / 04", Math.max(left, 280), 192);
          context.fillText("−17.04", Math.min(right - 34, 642), 291);
          context.restore();
        };

        const updateProgress = (now = performance.now()) => {
          const frameScale = clamp((now - state.lastRenderedAt) / (1000 / 60), 0, 30);
          state.lastRenderedAt = now;
          const smoothing = 1 - Math.pow(0.925, frameScale);
          state.visibleProgress = lerp(state.visibleProgress, state.targetProgress, smoothing);
          const percentage = Math.round(state.visibleProgress * 100);
          progressText.innerHTML = `${String(percentage).padStart(2, "0")}<small>%</small>`;
          const litSegments = Math.round(state.visibleProgress * segments.length);
          segments.forEach((segment, index) => {
            segment.classList.toggle("active", index < litSegments);
            segment.classList.toggle("head", index === litSegments - 1 && litSegments < segments.length);
          });
        };

        const render = (now) => {
          const elapsed = now - state.startedAt;
          const reveal = reducedMotion.matches ? 1 : easeOut(clamp(elapsed / 1250));
          const exit = state.finishing
            ? easeInOut(clamp((now - state.finishStartedAt) / (reducedMotion.matches ? 80 : 520)))
            : 0;

          updateProgress(now);
          drawBackground(now, exit);
          drawSurveyField(reveal, now, exit);
          drawRift(reveal, now, exit);
          if (exit < 1) state.animationFrame = requestAnimationFrame(render);
        };

        window.setSplashStatus = (status, progress) => {
          if (typeof status === "string" && status.trim()) statusText.textContent = status.trim();
          if (Number.isFinite(progress)) state.targetProgress = clamp(progress / 100);
          const percentage = Math.round(state.targetProgress * 100);
          progressRail.setAttribute("aria-valuenow", String(percentage));
          progressAnnouncement.textContent = `${statusText.textContent}，${percentage}%`;
        };

        window.finishSplash = () => {
          if (state.finishing) return Promise.resolve();
          state.targetProgress = 1;
          state.finishing = true;
          state.finishStartedAt = performance.now();
          document.body.classList.add("finishing");
          return new Promise((resolve) => setTimeout(resolve, reducedMotion.matches ? 90 : 540));
        };

        window.__paleRiftMotion = Object.freeze({
          name: "白域断层",
          palette: "light-industrial",
          movingLayers: ["fallout", "surveyScan", "fracture", "carrier", "progress"],
        });

        resize();
        updateProgress();
        requestAnimationFrame(() => document.body.classList.add("ready"));
        state.animationFrame = requestAnimationFrame(render);
        window.addEventListener("resize", resize);
        window.addEventListener("beforeunload", () => cancelAnimationFrame(state.animationFrame));
      })();
    </script>
  </body>
</html>
