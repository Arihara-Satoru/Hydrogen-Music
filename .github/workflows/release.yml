name: Release

on:
  push:
    branches:
      - KuGou
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: --win
            artifact: windows-x64
            paths: |
              release/*.exe
              release/*.zip
              release/*.blockmap
              release/latest.yml
          - name: macOS arm64
            runner: macos-latest
            target: --mac
            artifact: macos-arm64
            paths: |
              release/*.dmg
              release/*.blockmap
          - name: macOS x64
            runner: macos-15-intel
            target: --mac
            artifact: macos-x64
            paths: |
              release/*.dmg
              release/*.blockmap
          - name: Linux x64
            runner: ubuntu-latest
            target: --linux
            artifact: linux-x64
            paths: |
              release/*.AppImage
              release/*.deb
              release/*.rpm
              release/*.blockmap
              release/latest-linux.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout KuGouMusicApi
        uses: actions/checkout@v4
        with:
          repository: Arihara-Satoru/KuGouMusicApi
          ref: main
          path: KuGouMusicApi
          token: ${{ github.token }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install KuGouMusicApi dependencies
        working-directory: KuGouMusicApi
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Setup MSVC build tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build application
        run: pnpm run dist -- ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          # ponytail: versions are assigned before the parallel builds; derive only notes here to keep artifact and tag versions aligned.
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          REPOSITORY_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TARGET="${TAG}"
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          else
            TARGET="HEAD"
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${TARGET}" 2>/dev/null || true)
          fi

          {
            echo "## 更新日志"
            echo
            if [ -n "${PREVIOUS_TAG}" ]; then
              git log --no-merges --format='%H%x09%s' "${PREVIOUS_TAG}..${TARGET}"
            else
              git log --no-merges --format='%H%x09%s' "${TARGET}"
            fi | while IFS=$'\t' read -r SHA SUBJECT; do
              printf -- '- %s ([`%.7s`](%s/commit/%s))\n' "${SUBJECT}" "${SHA}" "${REPOSITORY_URL}" "${SHA}"
            done
          } > RELEASE_NOTES.md

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.notes.outputs.tag }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --notes-file RELEASE_NOTES.md
            gh release upload "${TAG}" release/* --clobber
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file RELEASE_NOTES.md \
              release/*
          fi
